---
- name: Create influxdb group and user
  ansible.builtin.user:
    name: influxdb
    system: yes
    create_home: no
    shell: /bin/false

- name: Create InfluxDB directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: influxdb
    group: influxdb
    mode: '0755'
  loop:
    - /var/lib/influxdb
    - /etc/influxdb

- name: Unarchive InfluxDB from local file
  ansible.builtin.unarchive:
    src: "{{ influxdb_legacy_archive }}"
    dest: "{{ influxdb_legacy_install_dir }}"
    owner: influxdb
    group: influxdb
    strip_components: 1
    remote_src: no # WAŻNE: Mówimy, że plik jest w roli, a nie na serwerze zdalnym
    creates: "{{ influxdb_legacy_install_dir }}/influxd"

- name: Copy binaries to /usr/bin
  ansible.builtin.copy:
    src: "{{ influxdb_legacy_install_dir }}/{{ item }}"
    dest: "/usr/bin/{{ item }}"
    remote_src: yes
    mode: '0755'
  loop:
    - influx
    - influxd

- name: Create default config file
  ansible.builtin.command: influxd config > {{ influxdb_legacy_config_file }}
  args:
    creates: "{{ influxdb_legacy_config_file }}"

- name: Create systemd service file
  ansible.builtin.template:
    src: influxdb.service.j2
    dest: /etc/systemd/system/influxdb.service
    mode: '0644'
  notify: Reload systemd and restart influxdb

- name: Start and enable InfluxDB service
  ansible.builtin.service:
    name: influxdb
    state: started
    enabled: yes