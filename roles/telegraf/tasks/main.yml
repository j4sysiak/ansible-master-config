---
- name: Add Telegraf GPG key
  ansible.builtin.get_url:
    url: https://repos.influxdata.com/influxdata-archive_compat.key
    dest: /usr/share/keyrings/influxdata-archive_compat.gpg # Używamy tego samego klucza
    mode: '0644'
    force: true

- name: Add Telegraf repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/influxdata-archive_compat.gpg] https://repos.influxdata.com/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    update_cache: yes

# Nowa, poprawiona wersja
- name: Install Telegraf
  ansible.builtin.apt:
    name: telegraf
    state: present

- name: Configure Telegraf
  ansible.builtin.template:
    src: telegraf.conf.j2
    dest: /etc/telegraf/telegraf.conf
    owner: telegraf
    group: telegraf
    mode: '0640'
  notify: Restart Telegraf

- name: Start and enable Telegraf service
  ansible.builtin.service:
    name: telegraf
    state: started
    enabled: yes