---
- name: Install PostgreSQL server and client
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-client
    state: present
- name: Ensure PostgreSQL service is started and enabled
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: yes


# --- NOWA, POPRAWNA WERSJA ---
- name: Create the "test" database
  community.postgresql.postgresql_db:
    name: test
    state: present
    login_user: postgres  # <-- Ta opcja robi całą magię!
  become: true  # 'become' jest nadal potrzebne, aby mieć uprawnienia do uruchomienia polecenia