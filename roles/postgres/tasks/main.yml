---
- name: Install PostgreSQL and dependencies
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-client
      - python3-psycopg2
    state: present
    update_cache: yes

- name: Allow local connections using md5 for all users
  ansible.builtin.lineinfile:
    path: /etc/postgresql/14/main/pg_hba.conf
    regexp: '^local\s+all\s+all\s+peer'
    line: 'local   all             all                                     md5'
    backrefs: yes
  notify: Restart PostgreSQL

- name: Ensure PostgreSQL service is started and enabled
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: yes

# --- NOWA, OSTATECZNA SEKCJA DO ZARZĄDZANIA BAZĄ ---

- name: Create a dedicated admin user for Ansible
  community.postgresql.postgresql_user:
    name: ansible_admin
    password: "SuperSecurePassword123!" # Zmień to w przyszłości!
    role_attr_flags: SUPERUSER,LOGIN
    state: present
  become: true
  become_user: postgres

- name: Create the "test" database owned by our admin user
  community.postgresql.postgresql_db:
    name: test
    owner: ansible_admin
    state: present
  become: true
  become_user: postgres