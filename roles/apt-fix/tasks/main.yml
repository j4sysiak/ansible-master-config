---
- name: Remove potentially problematic repository files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/influxdb.list
    - /etc/apt/sources.list.d/influxdata.list

- name: Remove potentially problematic GPG key
  ansible.builtin.file:
    path: /usr/share/keyrings/influxdata-archive_compat.gpg
    state: absent

- name: Force apt cache update after cleanup
  ansible.builtin.apt:
    update_cache: yes
  changed_when: false

  # --- NOWA SEKCJA: CZYSZCZENIE JAVY ---
- name: Purge all OpenJDK packages
  ansible.builtin.apt:
    name: "openjdk-*"
    state: absent
    purge: yes
  
- name: Autoremove dependencies after purging Java
  ansible.builtin.apt:
    autoremove: yes
    
- name: Remove manually installed Java directories
  ansible.builtin.file:
    path: "/opt/jdk"
    state: absent

- name: Remove Java environment file
  ansible.builtin.file:
    path: /etc/profile.d/java_home.sh
    state: absent
# --- KONIEC NOWEJ SEKCJI ---