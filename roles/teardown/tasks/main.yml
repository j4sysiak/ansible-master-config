---
# tasks file for teardown

- name: Stop and disable Nginx service
  ansible.builtin.service:
    name: nginx
    state: stopped
    enabled: no
  ignore_errors: yes # Ignoruj błąd, jeśli usługa już nie istnieje

- name: Uninstall Nginx
  ansible.builtin.apt:
    name: nginx
    state: absent
    purge: yes # Usuń też pliki konfiguracyjne
    autoremove: yes # Usuń niepotrzebne zależności

- name: Stop and disable PostgreSQL service
  ansible.builtin.service:
    name: postgresql
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Uninstall PostgreSQL
  ansible.builtin.apt:
    name: postgresql
    state: absent
    purge: yes
    autoremove: yes

- name: Flush all iptables rules
  ansible.builtin.iptables:
    flush: yes
  notify: Save flushed iptables rules

- name: Ensure iptables-persistent is installed (for handler)
  ansible.builtin.apt:
    name: iptables-persistent
    state: present

    # --- NOWA SEKCJA DLA INFLUXDB ---
- name: Stop and disable InfluxDB service
  ansible.builtin.service:
    name: influxdb
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Uninstall InfluxDB and its dependencies
  ansible.builtin.apt:
    name: influxdb2
    state: absent
    purge: yes # Ważne: usuń też pliki konfiguracyjne
    autoremove: yes

- name: Remove InfluxDB data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/influxdb/
    - /root/.influxdbv2/ # Usuwamy plik konfiguracyjny!
    - /etc/influxdb/