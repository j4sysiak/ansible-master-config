---
# tasks file for teardown

- name: Stop and disable Nginx service
  ansible.builtin.service:
    name: nginx
    state: stopped
    enabled: no
  ignore_errors: yes # Ignoruj błąd, jeśli usługa już nie istnieje

- name: Uninstall Nginx
  ansible.builtin.apt:
    name: nginx
    state: absent
    purge: yes # Usuń też pliki konfiguracyjne
    autoremove: yes # Usuń niepotrzebne zależności

- name: Stop and disable PostgreSQL service
  ansible.builtin.service:
    name: postgresql
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Uninstall PostgreSQL
  ansible.builtin.apt:
    name: postgresql
    state: absent
    purge: yes
    autoremove: yes

- name: Flush all iptables rules
  ansible.builtin.iptables:
    flush: yes
  notify: Save flushed iptables rules

- name: Ensure iptables-persistent is installed (for handler)
  ansible.builtin.apt:
    name: iptables-persistent
    state: present

    # --- NOWA SEKCJA DLA INFLUXDB ---
- name: Stop and disable InfluxDB service
  ansible.builtin.service:
    name: influxdb
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Uninstall InfluxDB and its dependencies
  ansible.builtin.apt:
    name: influxdb2
    state: absent
    purge: yes # Ważne: usuń też pliki konfiguracyjne
    autoremove: yes


- name: Stop and disable InfluxDB service
  ansible.builtin.service:
    name: influxdb
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Uninstall InfluxDB and its dependencies
  ansible.builtin.apt:
    name: influxdb2
    state: absent
    purge: yes
    autoremove: yes

- name: Remove ALL InfluxDB data and configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/influxdb/  # Główny katalog danych
    - /root/.influxdbv2/   # Konfiguracja CLI dla roota
    - /etc/influxdb/       # Dodatkowe pliki konfiguracyjne
    - /var/log/influxdb/   # Logi


# --- NOWA SEKCJA: CZYSZCZENIE DOCKERA ---
- name: Stop and disable Docker service
  ansible.builtin.service:
    name: docker
    state: stopped
    enabled: no
  ignore_errors: yes
  tags: ['docker'] # Dodajemy tagi dla elastyczności

- name: Uninstall Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: absent
    purge: yes
    autoremove: yes
  tags: ['docker']

- name: Remove Docker apt repository
  ansible.builtin.apt_repository:
    repo: >
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      signed-by=/etc/apt/keyrings/docker.gpg]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: absent
  tags: ['docker']

- name: Remove Docker GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.gpg
    state: absent
  tags: ['docker']

- name: Remove 'ubuntu' user from the docker group
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: no # 'append: no' w praktyce oznacza 'usuń z tej grupy'
  tags: ['docker']