---
- name: Create parent directory for JDK installations
  ansible.builtin.file:
    path: "{{ java_install_parent_dir }}"
    state: directory
    mode: '0755'

- name: Download and Unarchive JDK using shell
  ansible.builtin.shell: |
    wget -O "/tmp/{{ java_local_archive }}" "{{ java_local_archive_url }}"
    tar -xvf "/tmp/{{ java_local_archive }}" -C "{{ java_install_parent_dir }}"
  args:
    creates: "{{ java_install_parent_dir }}/{{ java_local_unpacked_dir }}"

# --- NOWE, OSTATECZNE ZADANIE ---
- name: Create symbolic links for Java binaries
  ansible.builtin.file:
    src: "{{ java_install_parent_dir }}/{{ java_local_unpacked_dir }}/bin/{{ item }}"
    dest: "/usr/bin/{{ item }}"
    state: link
    force: yes
  loop:
    - java
    - javac
    - jar
    - jps

- name: Clean up the temporary JDK archive
  ansible.builtin.file:
    path: "/tmp/{{ java_local_archive }}"
    state: absent