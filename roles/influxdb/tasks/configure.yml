---
- name: Wait for InfluxDB to be ready
  ansible.builtin.uri:
    url: http://localhost:8086/ready
    status_code: 200
  register: result
  until: result.status == 200
  retries: 10
  delay: 5

- name: Check if setup was already completed (by checking for the org)
  ansible.builtin.uri:
    url: http://localhost:8086/api/v2/orgs?org={{ influxdb_org }}
    method: GET
  register: org_check
  failed_when: false # Ignoruj błąd 404, jeśli org nie istnieje

- name: Setup InfluxDB via API
  when: org_check.status != 200 # Uruchom tylko, jeśli org nie istnieje
  block:
    - name: Create initial user, org, and bucket via API
      ansible.builtin.uri:
        url: http://localhost:8086/api/v2/setup
        method: POST
        body_format: json
        body:
          username: "{{ influxdb_admin_user }}"
          password: "{{ influxdb_admin_password }}"
          org: "{{ influxdb_org }}"
          bucket: "{{ influxdb_bucket }}"
          retentionPeriodHrs: 0
        status_code: 201
      register: setup_response
 

    - name: Store the admin token as a fact
      ansible.builtin.set_fact:
        influxdb_admin_token: "{{ setup_response.json.auth.token }}"

    - name: Display the admin token (for debugging, can be removed)
      ansible.builtin.debug:
        msg: "InfluxDB configured. Admin token: {{ influxdb_admin_token }}"
 