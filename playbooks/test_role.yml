---
- name: Test a specific role
  hosts: all # Celujemy we wszystkie hosty, bo nie wiemy, która rola będzie testowana
  become: true

  # Tutaj będziemy "wstrzykiwać" rolę, którą chcemy przetestować
  roles:
    - role: apt-fix      # <-- ZAWSZE uruchom jako pierwszy krok
      tags: ['always']

    - role: "{{ test_role }}"
      tags: ['test']
      