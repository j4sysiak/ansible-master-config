---
- name: Apply common configuration to all hosts
  hosts: all
  become: true

  # --- PRZENIESIONA I POPRAWIONA SEKCJA ZMIENNYCH ---
  vars:
    firewall_rules:
      - { proto: 'tcp', port: '22', comment: 'Allow SSH' }
      - { proto: 'tcp', port: '80', comment: 'Allow HTTP for Nginx' }
      - { proto: 'tcp', port: '5432', comment: 'Allow PostgreSQL' }
      - { proto: 'tcp', port: '8080', comment: 'Allow Tomcat' }
      - { proto: 'tcp', port: '8086', comment: 'Allow InfluxDB' } # <-- NOWA REGUŁA do: InfluxDB

  roles:
    - role: common
      tags: ['common']
    - role: firewall
      tags: ['firewall']

- name: Configure web servers
  hosts: web_servers
  become: true
  roles:
    - role: nginx
      tags: ['nginx']

- name: Configure database servers
  hosts: db_servers
  become: true
  roles:
    - role: postgres
      tags: ['postgres']

- name: Configure application servers
  hosts: app_servers
  become: true
  roles:
    - role: tomcat
      tags: ['tomcat']

# --- NOWA SEKCJA (NOWY "PLAY") ---
- name: Configure monitoring servers
  hosts: monitoring_servers
  become: true
  roles:
    - role: influxdb
      tags: ['influxdb']
# --- KONIEC NOWEJ SEKCJI ---