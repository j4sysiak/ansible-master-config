- name: Configure application servers
  hosts: app_servers
  become: true
  roles:
    - role: tomcat
      tags: ['tomcat']

# playbooks/setup.yml
- name: Configure monitoring servers
  hosts: monitoring_servers
  become: true
  roles:
    - role: influxdb
      tags: ['monitoring', 'influxdb'] # Dwa tagi!
    - role: telegraf
      tags: ['monitoring', 'telegraf'] # Dwa tagi!
    - role: grafana
      tags: ['monitoring', 'grafana'] # Dwa tagi!
    - role: prometheus
      tags: ['monitoring', 'prometheus'] # Dwa tagi!

- name: Configure Docker
  hosts: all # Docker przyda się wszędzie
  become: true
  roles:
    - role: docker
      tags: ['docker']