---
- name: Pre-flight checks and apt cleanup
  hosts: all
  become: true
  roles:
    - apt-fix

- name: Apply common configuration to all hosts
  hosts: all
  become: true

  # --- PRZENIESIONA I POPRAWIONA SEKCJA ZMIENNYCH ---
  vars:
    firewall_rules:
      - { proto: 'tcp', port: '22', comment: 'Allow SSH' }
      - { proto: 'tcp', port: '80', comment: 'Allow HTTP for Nginx' }
      - { proto: 'tcp', port: '5432', comment: 'Allow PostgreSQL' }
      - { proto: 'tcp', port: '8080', comment: 'Allow Tomcat' }
      - { proto: 'tcp', port: '8086', comment: 'Allow InfluxDB' }
      - { proto: 'tcp', port: '3000', comment: 'Allow Grafana' }
      - { proto: 'tcp', port: '9090', comment: 'Allow Prometheus' }

  roles:
    - role: common
      tags: ['common']
    - role: firewall
      tags: ['firewall']

- name: Configure web servers
  hosts: web_servers
  become: true
  roles:
    - role: nginx
      tags: ['nginx']

- name: Configure database servers
  hosts: db_servers
  become: true
  roles:
    - role: postgres
      tags: ['postgres']

#   komentuję to bo za długo trwa transfer pliku "OpenJDK11U-jdk_x64_linux_hotspot_11.0.28_6.tar.gz" do Oracla
# - name: Configure Java environment
#   hosts: java_hosts
#   become: true
#   roles:
#     - role: java_local
