all:
  children:
    # Grupa dla serwerów WWW
    web_servers:
      hosts:
        ubuntu-vm:

    # Grupa dla serwerów bazodanowych
    db_servers:
      hosts:
        ubuntu-vm:

    # Grupa dla serwerów aplikacji
    app_servers:
      hosts:
        ubuntu-vm:
        
    # Grupa dla hostów, na których instalujemy Javę
    java_hosts:
      hosts:
        ubuntu-vm:

    # Grupa dla serwerów monitoringu (InfluxDB, Telegraf, Grafana)
