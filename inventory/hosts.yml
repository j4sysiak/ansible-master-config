      hosts:
        ubuntu-vm:

  # Sekcja definiująca szczegóły połączenia dla każdego hosta
  hosts:
    ubuntu-vm:
      ansible_host: 130.61.228.18 # <-- Upewnij się, że to jest aktualny adres IP
      ansible_user: ubuntu
      ansible_private_key_file: ~/.ssh/oracle_key.key
      ansible_python_interpreter: /usr/bin/python3