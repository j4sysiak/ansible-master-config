---
# Zmienne dostępne dla wszystkich hostów

# Konfiguracja firewalla
firewall_rules:
  - { proto: 'tcp', port: '22', comment: 'Allow SSH' }
  - { proto: 'tcp', port: '80', comment: 'Allow HTTP for Nginx' }
  - { proto: 'tcp', port: '5432', comment: 'Allow PostgreSQL' }
  - { proto: 'tcp', port: '8086', comment: 'Allow InfluxDB' }
  - { proto: 'tcp', port: '3000', comment: 'Allow Grafana' }

# Konfiguracja InfluxDB
influxdb_admin_user: "jacek"
influxdb_admin_password: "jacek!"
influxdb_org: "jacek-org"
influxdb_bucket: "jacek-bucket"
influxdb_admin_token: "" # Pusta wartość początkowa


 